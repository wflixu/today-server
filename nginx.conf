server {
                listen 80;
                listen [::]:80;
                server_name   api.wflixu.cn;
                location / {
                            proxy_pass  http://127.0.0.1:8443; # 转发规则
                            proxy_set_header Host $proxy_host; # 修改转发请求头，让8080端口的应用可以受到真实的请求
                            proxy_set_header X-Real-IP $remote_addr;
                            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                 }
         }


         server {
                listen       443 ssl;

                server_name           api.wflixu.cn;
                ssl_certificate       /home/ubuntu/docs/api.wflixu.cn_bundle.crt;
                ssl_certificate_key   /home/ubuntu/docs/api.wflixu.cn.key;

                ssl_session_cache    shared:SSL:1m;
                ssl_session_timeout  5m;
                client_max_body_size 10m;

                 #    ssl_ciphers  HIGH:!aNULL:!MD5;
                #    ssl_prefer_server_ciphers  on;

                location / {
                        #add_header Access-Control-Allow-Origin *;
                        #add_header Access-Control-Allow-Methods 'GET,POST,DELETE,OPTIONS,PUT,HEAD'; # 改写路径
                         proxy_pass  http://127.0.0.1:8443; # 转发规则
                         proxy_set_header Host $host; # 修改转发请求头，让8080端口的应用可以受到真实的请求
                         proxy_set_header X-Real-IP $remote_addr;
                         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                         proxy_set_header Access-Control-Allow-Origin *;  # 允许任何来源的请求  
                         proxy_set_header Access-Control-Allow-Methods "GET,POST,OPTIONS,DELETE,PUT,HEAD";  # 允许的请求方法  
                 }
         }